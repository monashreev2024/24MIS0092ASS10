apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic-management-system
  labels:
    app: traffic-app
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: traffic-app
  template:
    metadata:
      labels:
        app: traffic-app
  spec:
    containers:
    - name: traffic-container
      image: YOUR_DOCKERHUB_USERNAME/traffic-system:latest
      imagePullPolicy: Always
      ports:
      - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: traffic-service
spec:
  type: NodePort
  selector:
    app: traffic-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 32180
