apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic-system-deployment
  labels:
    app: traffic-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: traffic-system
  template:
    metadata:
      labels:
        app: traffic-system
    spec:
      containers:
      - name: traffic-dashboard
        image: monashree1511/metro:v1
        ports:
        - containerPort: 80
        imagePullPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: traffic-system-service
spec:
  type: NodePort
  selector:
    app: traffic-system
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 32000
